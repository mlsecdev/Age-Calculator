<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #7b61ff;
            --accent-color: #ff6b6b;
            --bg-gradient: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            --text-color: #2d3436;
            --card-bg: #ffffff;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        h1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-color);
            margin-bottom: 30px;
            font-weight: 600;
        }

        .calendar-icon {
            width: 28px;
            height: 28px;
            fill: var(--primary-color);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (min-width: 480px) {
            .input-group {
                flex-direction: row;
                align-items: flex-end;
            }
        }

        .field {
            flex: 1;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: #636e72;
            margin-bottom: 8px;
            font-weight: 400;
        }

        input[type="date"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #edeff2;
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-color);
            transition: border-color 0.3s ease;
            outline: none;
        }

        input[type="date"]:focus {
            border-color: var(--primary-color);
        }

        button {
            padding: 12px 24px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 10px;
        }

        @media (min-width: 480px) {
            button {
                margin-top: 0;
            }
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            filter: brightness(1.05);
        }

        button:active {
            transform: translateY(0);
        }

        #result {
            margin-top: 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-color);
            opacity: 0;
            transform: scale(0.9);
            animation: popIn 0.5s ease forwards;
        }

        .error-text {
            color: #d63031;
            font-size: 0.9rem;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes popIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>
            <svg class="calendar-icon" viewBox="0 0 24 24">
                <path d="M19,4H18V2H16V4H8V2H6V4H5C3.89,4 3,4.9 3,6V20C3,21.1 3.89,22 5,22H19C20.1,22 21,21.1 21,20V6C21,4.9 20.1,4 19,4M19,20H5V10H19V20M19,8H5V6H19V8Z" />
            </svg>
            Age Calculator
        </h1>

        <div class="input-group">
            <div class="field">
                <label for="birthdate">Enter your birthdate</label>
                <input type="date" id="birthdate" placeholder="MM/DD/YYYY">
            </div>
            <button id="calculateBtn">Calculate</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        document.getElementById('calculateBtn').addEventListener('click', calculateAge);

        function calculateAge() {
            const birthdateInput = document.getElementById('birthdate').value;
            const resultDiv = document.getElementById('result');
            
            // Clear previous results
            resultDiv.innerHTML = '';

            if (!birthdateInput) {
                showError('Please enter a valid birthdate.');
                return;
            }

            const birthDate = new Date(birthdateInput);
            const today = new Date();

            if (birthDate > today) {
                showError('Birthdate cannot be in the future.');
                return;
            }

            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();

            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }

            showResult(`You're now ${age} years old!`);
        }

        function showResult(message) {
            const resultDiv = document.getElementById('result');
            const resultText = document.createElement('div');
            resultText.className = 'result-text';
            resultText.textContent = message;
            resultDiv.appendChild(resultText);
        }

        function showError(message) {
            const resultDiv = document.getElementById('result');
            const errorText = document.createElement('div');
            errorText.className = 'error-text';
            errorText.textContent = message;
            resultDiv.appendChild(errorText);
        }
        
        // Handle Enter key
        document.getElementById('birthdate').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                calculateAge();
            }
        });
    </script>
</body>
</html>
